name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run core module unit tests
        run: ./gradlew :core:test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: royal-miles-debug
          path: app/build/outputs/apk/debug/*.apk

      # Only on main: publish the raw APK as a "latest" GitHub Release asset so it can be
      # downloaded and tapped to install directly, no zip/extract step required.
      - name: Publish latest debug APK as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest debug build
          body: |
            Automatically rebuilt from every push to `main` (commit ${{ github.sha }}).
            Unsigned debug build for sideloading only — not for distribution.
          files: app/build/outputs/apk/debug/*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
