name: Android build

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run core module unit tests
        run: ./gradlew :core:test --console=plain

      # The app module holds the regeneration logic that protects the training log, and until
      # now none of its tests ran anywhere. Room migrations still aren't covered — that needs
      # schema export and an instrumented test — but everything else here is.
      - name: Run app module unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # Upgrade steps and backup/restore run against a real Android SQLite on an emulator, since
      # the JVM can't reproduce the device. Before any APK is published, so a failure here means
      # the build never reaches her phone.
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run database tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Give APK a unique commit-based name
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/royal-miles-${GITHUB_SHA::7}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: royal-miles-debug
          path: app/build/outputs/apk/debug/*.apk

      # Only on main: publish the raw APK as a GitHub Release asset so it can be downloaded and
      # tapped to install directly, no zip/extract step required. Tag is namespaced to this app —
      # this repo holds more than one unrelated project, and a bare "latest" tag turned out to
      # already exist from one of them, so reusing it would silently collide.
      - name: Publish latest debug APK as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: royal-miles-latest
          name: Royal Miles — latest debug build
          body: |
            Automatically rebuilt from every push to `main` (commit ${{ github.sha }}).
            Unsigned debug build for sideloading only — not for distribution.
          files: app/build/outputs/apk/debug/*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # What the app's update check reads. Uploaded after the APK, so it never points at a file
      # that isn't there yet; the checksum lets the app refuse a download that doesn't match.
      - name: Publish update.json for the in-app updater
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="royal-miles-${GITHUB_SHA::7}.apk"
          SUM="$(sha256sum "app/build/outputs/apk/debug/$APK" | cut -d' ' -f1)"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --argjson version_code "$GITHUB_RUN_NUMBER" --arg sha "${GITHUB_SHA::7}" \
            --arg apk "$APK" --arg sha256 "$SUM" --arg built_at "$BUILT_AT" \
            '{version_code: $version_code, sha: $sha, apk: $apk, sha256: $sha256, built_at: $built_at}' > update.json
          cat update.json
          gh release upload royal-miles-latest update.json --clobber

      # Same idea for development branches, so an in-progress build has a tap-to-install link too —
      # not just main's stable one. One release per branch (tag derived from the branch name, "/"
      # replaced since a literal slash would nest it under a different ref namespace) so pushing
      # again updates the same release instead of piling up new ones. prerelease + make_latest:
      # false keeps it out of the "Latest" badge that main's release owns.
      - name: Compute branch release tag
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/codex/'))
        id: branch_tag
        run: echo "tag=royal-miles-branch-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Publish latest debug APK for this branch as a release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/codex/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.branch_tag.outputs.tag }}
          name: "Royal Miles — ${{ github.ref_name }} (branch build)"
          body: |
            Automatically rebuilt from every push to `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Unsigned debug build for sideloading only — not for distribution.
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
